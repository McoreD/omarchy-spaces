# Builds the `space` that install.sh downloads, when a version's tag is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag is the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version manifest.json)"
      - run: cargo build --release --locked
      - run: scripts/package.sh target/release/space ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: space-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
