name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Hyprland's Lua is 5.5, which Ubuntu doesn't have; the syntax is the same.
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: node --test omarchy/tests/*.test.mjs
      - run: luac5.4 -p hypr/omarchy-spaces.lua
      - run: lua5.4 hypr/tests/keys.lua
      # `omarchy plugin add` refuses a repository with any.
      - name: Check that there are no symlinks
        run: "! git ls-files --stage | grep ^120000"
