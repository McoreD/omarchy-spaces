[package]
name = "omarchy-spaces"
version = "0.2.0"
edition = "2024"
description = "Project-based layout for Omarchy"
license = "MIT AND Apache-2.0" # Apache-2.0 for Herdr's sounds, in the binary
repository = "https://github.com/t4t5/omarchy-spaces"
publish = false

[[bin]]
name = "space"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
